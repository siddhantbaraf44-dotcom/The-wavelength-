name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *fixed*.zip 2>/dev/null | head -1)
            [ -z "$ZIP" ] && ZIP=$(ls *.zip | head -1)
            echo "Using $ZIP"
            unzip -q "$ZIP" -d _proj
            cd "$(dirname "$(find _proj -name settings.gradle.kts | head -1)")"
          fi
          gradle :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Wavelength.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Wavelength-apk
          path: out/Wavelength.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" out/Wavelength.apk --title "Wavelength build ${{ github.run_number }}" --notes "Debug APK"
